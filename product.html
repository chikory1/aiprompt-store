<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Product</title>
</head>
<body>
<div class="app">
  <header class="header"><div class="logo"><img src="assets/logo.svg" alt="logo"/></div></header>
  <main class="container">
    <section id="product" class="product">
      <div class="prod-left">
        <div id="prod-cover" class="prod-cover"></div>
      </div>
      <div class="prod-right">
        <h1 id="prod-title"></h1>
        <div class="price" id="prod-price"></div>
        <p id="prod-short" class="lead"></p>
        <h4>Что внутри</h4>
        <ul id="prod-list"><li>Готовый промт</li></ul>
        <pre class="preview" id="prod-preview"></pre>
        <div style="margin-top:18px">
          <button class="btn btn-primary" id="buyNow">Купить сейчас</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
