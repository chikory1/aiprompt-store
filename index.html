<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Prompt Store — WebApp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo"><img src="assets/logo.svg" alt="logo" /></div>
    <div class="actions"><button id="my-purchases" class="ghost">Мои покупки</button></div>
  </header>
  <main class="container">
    <section class="hero">
      <div class="hero-cover" style="background-image:url('assets/cover_main.webp')"></div>
      <div class="hero-content">
        <h1>AI PROMPT BUNDLE</h1>
        <p class="lead">Премиальные промты для ChatGPT. Копируйте, вставляйте, получайте результат.</p>
        <div class="cta-row">
          <button class="btn btn-primary" id="gotoCatalog">Перейти в каталог</button>
        </div>
      </div>
    </section>
    <section id="catalog" class="catalog">
      <h3>Популярные</h3>
      <div id="cards" class="cards"></div>
    </section>
  </main>
  <footer class="footer">
    <small>© 2025 AI Prompt Store — Created by Alina.D</small>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
